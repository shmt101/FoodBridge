<div class="yt-card">
  <button type="button" class="yt-facade" data-yt="{{ v.id }}" aria-label="Play video: {{ v.title }}">
    <img src="https://i.ytimg.com/vi/{{ v.id }}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display='none'">
    <span class="yt-play"><i class="bi bi-play-fill"></i></span>
  </button>
  <div class="yt-meta">
    <span class="src">{{ v.source }}</span>
    <strong>{{ v.title }}</strong>
    <p>{{ v.blurb }}</p>
    <a href="https://www.youtube.com/watch?v={{ v.id }}" target="_blank" rel="noopener">Watch on YouTube <i class="bi bi-box-arrow-up-right"></i></a>
  </div>
</div>
