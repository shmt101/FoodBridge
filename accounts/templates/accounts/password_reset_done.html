{% extends "base_app.html" %}
{% block title %}Check your email · FoodBridge{% endblock %}
{% block content %}
<div class="app-card pending-card" style="max-width:520px">
  <div class="pending-art"><i class="bi bi-envelope-check"></i></div>
  <h2 class="section-title">Check your email</h2>
  <p class="text-muted">If an account exists for that address, a reset link is on its way. It can take a minute, so check your spam folder too.</p>
  <a class="btn btn-outline-forest" href="{% url 'accounts:login' %}">Back to log in</a>
</div>
{% endblock %}
