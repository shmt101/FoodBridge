{% extends "base_app.html" %}
{% block title %}Log in · FoodBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="app-card">
      <h2 class="mb-3">Log in</h2>
      {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        <button class="btn btn-forest w-100" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 small">No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
